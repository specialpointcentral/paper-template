name: Build and Release LaTeX document

on:
  push:
    branches: [ master ]
    tags:
    - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Least privilege by default; jobs that need more (Pages / Release) ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAINFILE: paper

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript python3-venv

      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Build drawio
        uses: rlespinasse/drawio-export-action@97446a4e70fb02ea837963aeab0508ab6daae3e9 # v2.38.0
        with:
          action-mode: all
          remove-page-suffix: true
          path: drawio
          output: .
          format: pdf
          crop: true

      - name: Build AI pictures
        run: make aipics

      - name: Build matplotlib
        run: make python

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@25080975331dc4fc8e6f1af55788e00f84f51fff # 4.0.0
        with:
          root_file: ${{ env.MAINFILE }}.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          args: "-synctex=1 -interaction=nonstopmode -file-line-error"
          post_compile: "chmod -R 777 ."

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.MAINFILE }}-logs
          path: |
            *.log
            *.blg
          if-no-files-found: ignore

      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.MAINFILE }}-pdf
          path: ${{ env.MAINFILE }}.pdf
          if-no-files-found: error

      # Only the PDF (plus a redirecting index) is published, never the sources.
      - name: Prepare GitHub Pages site
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir site
          cp "${MAINFILE}.pdf" site/
          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${MAINFILE}.pdf">
          <title>${MAINFILE}.pdf</title>
          <a href="${MAINFILE}.pdf">${MAINFILE}.pdf</a>
          EOF

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy-pages:
    needs: build
    # Never on pull requests or tags: only the master branch is published.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.MAINFILE }}-pdf

      - name: Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: ${{ env.MAINFILE }}.pdf
